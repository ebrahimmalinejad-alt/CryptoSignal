name: Cross-Exchange Pump Radar

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

concurrency:
  group: pump-radar-engine
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 380
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Execute Pump Radar
        run: node bot.js

      - name: Sync Radar States
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add active_pumps.json pump_history.json || true
          git commit -m "Auto-sync pump states [skip ci]" || true
          git push origin main || true

      - name: Clean Workflow Runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run list --workflow "Cross-Exchange Pump Radar" --json databaseId -q '.[].databaseId' | while read -r run_id; do
            if [ "$run_id" != "$GITHUB_RUN_ID" ]; then
              gh run delete "$run_id" || true
            fi
          done
