name: 6-Hour Modular Crypto Scanner

on:
  schedule:
    - cron: '0 */6 * * *'  # Runs every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
  workflow_dispatch:

concurrency:
  group: modular-scanner-engine
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 380 # Safe buffer for 6-hour continuous runs
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Execute Modular Scanner
        run: node bot.js

      - name: Sync States & History
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add active_trades.json trade_history.json watchlist.json || true
          git commit -m "Auto-sync trades & history [skip ci]" || true
          git push origin main || true

      - name: Clean Workflow Runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run list --workflow "6-Hour Modular Crypto Scanner" --json databaseId -q '.[].databaseId' | while read -r run_id; do
            if [ "$run_id" != "$GITHUB_RUN_ID" ]; then
              gh run delete "$run_id" || true
            fi
          done
