name: RSI Market Monitor

on:
  schedule:
    - cron: '0 */5 * * *'  # Runs every 5 hours (00:00, 05:00, 10:00, 15:00, 20:00)
  workflow_dispatch:

concurrency:
  group: rsi-scanner-group
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 330 # Max 5.5 hours allowance
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Execute Scanner
        run: node bot.js

      - name: Save Active Trades and History
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add active_trades.json trade_history.json watchlist.json || true
          git commit -m "Auto-sync trades & history [skip ci]" || true
          git push origin main || true

      - name: Delete Previous Workflow Runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Cleaning up old workflow runs..."
          gh run list --workflow "RSI Market Monitor" --json databaseId -q '.[].databaseId' | while read -r run_id; do
            if [ "$run_id" != "$GITHUB_RUN_ID" ]; then
              gh run delete "$run_id" || true
            fi
          done
